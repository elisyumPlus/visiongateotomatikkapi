<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakım Yapılıyor</title>
    <!-- Tailwind CSS for modern styling and animations -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter and Press Start 2P for retro pixel vibes -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .pixel-font {
            font-family: 'Press Start 2P', monospace;
        }
        /* Custom animations for pixel worker tools */
        @keyframes hammer {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-45deg) translateY(-4px); }
        }
        .animate-hammer {
            animation: hammer 0.8s infinite ease-in-out;
            transform-origin: bottom right;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 relative">

    <main class="relative z-10 max-w-lg w-full bg-black/90 border border-zinc-900 rounded-3xl p-8 sm:p-10 shadow-2xl text-center flex flex-col items-center">

        <div class="mb-8 relative flex items-center justify-center">
            <!-- Glowing aura behind the builder -->
            <div class="absolute w-32 h-32 bg-amber-500/10 rounded-full blur-xl animate-pulse"></div>

            <!-- Pixel Art Container using SVG for crisp pixel rendering -->
            <div class="w-40 h-40 bg-zinc-950 border border-zinc-900 rounded-2xl flex items-center justify-center relative shadow-inner overflow-hidden group">
                
                <!-- SVG Pixel Construction Worker with Hard Hat -->
                <svg viewBox="0 0 64 64" class="w-28 h-28 drop-shadow-md">
                    <!-- Worker Body / Clothes -->
                    <rect x="22" y="44" width="20" height="16" fill="#3b82f6" rx="2"/>
                    <rect x="28" y="44" width="8" height="16" fill="#1d4ed8"/>
                    <rect x="26" y="38" width="12" height="8" fill="#fbcfe8"/>

                    <!-- Hard Hat (Yellow Baret) -->
                    <path d="M 16 26 L 48 26 C 50 26 52 24 50 22 C 45 16 35 14 32 14 C 29 14 19 16 14 22 C 12 24 14 26 16 26 Z" fill="#fbbf24"/>
                    <rect x="28" y="12" width="8" height="3" fill="#f59e0b" rx="1"/>

                    <!-- Head / Face -->
                    <rect x="20" y="26" width="24" height="14" fill="#fde047" rx="2"/>
                    <eyes>
                        <rect x="25" y="30" width="3" height="3" fill="#1e293b"/>
                        <rect x="36" y="30" width="3" height="3" fill="#1e293b"/>
                    </eyes>
                    <!-- Mustache / Smile -->
                    <rect x="28" y="36" width="8" height="2" fill="#b45309"/>

                    <!-- Animated Hammer Arm -->
                    <g class="animate-hammer">
                        <!-- Arm -->
                        <rect x="40" y="36" width="12" height="4" fill="#fde047" rx="2"/>
                        <!-- Hammer Handle -->
                        <rect x="48" y="28" width="4" height="16" fill="#78350f" rx="1"/>
                        <!-- Hammer Head -->
                        <rect x="44" y="24" width="12" height="6" fill="#64748b" rx="1"/>
                    </g>
                </svg>

                <!-- Floating Sparkle Effect -->
                <div class="absolute bottom-4 right-6 w-2 h-2 bg-amber-400 rounded-full animate-ping"></div>
            </div>
        </div>

        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-semibold uppercase tracking-wider mb-4">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
            Sistem Güncellemesi
        </div>

        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-3">
            Bakım Yapılıyor
        </h1>

        <p class="text-zinc-400 text-sm sm:text-base leading-relaxed max-w-md">
            Lütfen daha sonra uğrayınız.
        </p>

    </main>

</body>
</html>
