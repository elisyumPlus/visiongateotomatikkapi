<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sayfa Bulunamadı | Vision Gate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
        }
        h1 {
            font-size: 120px;
            font-weight: 900;
            color: #e50914;
            letter-spacing: 5px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
        }
        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #dddddd;
        }
        p {
            font-size: 16px;
            color: #888888;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background-color: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>404</h1>
        <h2>Kapı Kapalı, Sayfa Bulunamadı!</h2>
        <p>Otomatik kapılarımız her yeri açıyor ama sanırım bu sayfa sensörlerin görmediği kör bir noktada kalmış. Aramış olabilirsiniz ama maalesef burada kimse yok.</p>
        <a href="/" class="btn">Ana Kapıya Dön</a>
    </div>

</body>
</html>
